<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtCoder Records - Takiguchi Workshop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
      body {
        font-family: 'Inter', 'Noto Sans JP', sans-serif;
        background-color: #f8f8f8;
        color: #333;
      }

      #video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
      }
      #video-bg video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(8px) brightness(0.6);
      }

      main {
        position: relative;
        z-index: 10;
        background-color: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(2px);
      }

      .text-ac-blue {
        color: #337ab7;
      }
      .bg-ac-blue {
        background-color: #337ab7;
      }
      .hover\:bg-ac-blue-dark:hover {
        background-color: #286090;
      }
      .border-ac-blue {
        border-color: #337ab7;
      }

      /* レート色用クラス（JSで動的に付与） */
      .rate-gray {
        color: #808080;
        font-weight: bold;
      }
      .rate-brown {
        color: #804000;
        font-weight: bold;
      }
      .rate-green {
        color: #008000;
        font-weight: bold;
      }
      .rate-cyan {
        color: #00c0c0;
        font-weight: bold;
      }
      .rate-blue {
        color: #0000ff;
        font-weight: bold;
      }
      .rate-yellow {
        color: #c0c000;
        font-weight: bold;
      }
      .rate-orange {
        color: #ff8000;
        font-weight: bold;
      }
      .rate-red {
        color: #ff0000;
        font-weight: bold;
      }

      .contest-card {
        opacity: 0;
        transform: translateY(20px);
      }

      #modal-backdrop {
        display: none;
        opacity: 0;
      }
      #modal-content {
        opacity: 0;
        transform: scale(0.95);
      }

      footer {
        position: relative;
        z-index: 10;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div id="video-bg">
      <video autoplay loop muted playsinline poster="https://placehold.co/1920x1080/000000/333333?text=Loading...">
        <source src="./videos/background.mp4" type="video/mp4" />
      </video>
    </div>

    <main class="min-h-screen">
      <div class="container mx-auto max-w-5xl px-6 py-16 md:py-24">
        <header class="text-center mb-16">
          <h1 class="text-5xl md:text-6xl font-bold tracking-tight text-gray-900">AtCoder</h1>
          <p class="text-xl md:text-2xl mt-4 text-gray-600"></p>
        </header>

        <section
          id="profile-section"
          class="bg-white p-8 rounded-lg shadow-lg flex flex-col md:flex-row items-center gap-8 mb-16"
        >
          <img
            id="user-icon"
            src="https://img.atcoder.jp/icon/IlIlIlIlIlIlIlIl.png"
            alt="AtCoder Icon"
            class="w-32 h-32 rounded-full border-4 border-gray-200 shadow-md"
            onerror="
              this.onerror = null;
              this.src = 'https://placehold.co/128x128/337AB7/FFFFFF?text=AC';
            "
          />
          <div class="flex-1 text-center md:text-left">
            <h2 id="user-name" class="text-3xl font-bold text-gray-900">IlIlIlIlIlIlIlIl</h2>
            <p class="text-lg text-gray-600 mt-2">
              Estimated Rank: <span id="user-rating" class="rate-gray">Loading...</span>
            </p>
            <p class="text-md text-gray-500 mt-1">Main Language: <span id="user-lang">Loading...</span></p>
            <a
              id="atcoder-profile-link"
              href="https://atcoder.jp/users/IlIlIlIlIlIlIlIl"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-block bg-ac-blue text-white font-bold py-2 px-6 rounded-lg mt-4 transition-all duration-300 hover:bg-ac-blue-dark"
            >
              AtCoder Profile
            </a>
          </div>
        </section>

        <section id="rating-graph-section" class="bg-white p-6 md:p-8 rounded-lg shadow-lg mb-16">
          <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">Rating History (Estimated from Problems)</h3>
          <div class="w-full h-64 md:h-96">
            <canvas id="ratingChart"></canvas>
          </div>
        </section>

        <section id="contest-records-section">
          <h3 class="text-3xl font-bold text-gray-800 mb-8 text-center">Contest Records</h3>
          <div id="contest-records-container" class="space-y-6">
            <div class="text-center text-gray-500 py-8">データを取得中...</div>
          </div>
        </section>
      </div>
    </main>

    <footer class="text-center text-gray-400 py-10 border-t border-gray-700 bg-gray-900">
      <p>&copy; 2026 Takiguchi Workshop</p>
      <p class="mt-2 text-sm">
        このページの内容は Creative Commons 表示—継承（CC BY-SA）ライセンスの下で公開されています。
      </p>
    </footer>

    <div
      id="modal-backdrop"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-6"
    >
      <div id="modal-content" class="bg-white rounded-lg shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div class="p-6 md:p-8">
          <div class="flex justify-between items-start mb-4">
            <div>
              <h3 id="modal-title" class="text-2xl font-bold text-gray-900"></h3>
              <p id="modal-date" class="text-sm text-gray-500"></p>
            </div>
            <button
              id="modal-close-btn"
              class="text-gray-400 hover:text-gray-700 transition-colors text-3xl"
              title="閉じる"
            >
              &times;
            </button>
          </div>

          <div class="border-t border-gray-200 pt-4">
            <h4 class="text-lg font-semibold text-gray-800 mb-2">コンテストの統計・提出状況</h4>
            <div id="modal-stats" class="text-sm text-gray-600 mb-4 space-y-1"></div>
            <p id="modal-comment" class="text-base text-gray-700 leading-relaxed mb-6"></p>
            <a
              id="modal-solution-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-block bg-ac-blue text-white font-bold py-2 px-5 rounded-lg transition-all duration-300 hover:bg-ac-blue-dark"
            >
              提出コード
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const USER_ID = 'IlIlIlIlIlIlIlIl';
      let globalContestData = [];

      // レートに応じた色分けクラスを返す関数
      function getRatingClass(rating) {
        if (rating < 400) return 'rate-gray';
        if (rating < 800) return 'rate-brown';
        if (rating < 1200) return 'rate-green';
        if (rating < 1600) return 'rate-cyan';
        if (rating < 2000) return 'rate-blue';
        if (rating < 2400) return 'rate-yellow';
        if (rating < 2800) return 'rate-orange';
        return 'rate-red';
      }

      document.addEventListener('DOMContentLoaded', () => {
        const recordsContainer = document.getElementById('contest-records-container');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // ===============================================
        // AtCoder Problems API からデータ取得
        // ===============================================
        async function fetchAtCoderData() {
          try {
            // 1. ユーザーの提出履歴を取得
            const response = await fetch(
              `https://kenkoooo.com/atcoder/atcoder-api/v3/user/submissions?user=${USER_ID}&from_second=0`
            );
            if (!response.ok) throw new Error('API request failed');
            const submissions = await response.json();

            if (submissions.length === 0) {
              recordsContainer.innerHTML =
                '<div class="text-center text-gray-500 py-8">提出データが見つかりませんでした。</div>';
              return;
            }

            // --- データ加工処理 ---
            const contestsMap = {};
            const langCounter = {};

            // 提出時刻の降順にソート
            submissions.sort((a, b) => b.epoch_second - a.epoch_second);

            submissions.forEach((sub) => {
              // メイン言語集計用の言語名パース (例: "C++ 23 (gcc 13.2)" -> "C++")
              const baseLang = sub.language.split(' ')[0];
              langCounter[baseLang] = (langCounter[baseLang] || 0) + 1;

              // コンテストごとにデータをマージ
              if (!contestsMap[sub.contest_id]) {
                contestsMap[sub.contest_id] = {
                  id: sub.contest_id,
                  title: sub.contest_id.toUpperCase().replace(/_/g, ' '),
                  date: new Date(sub.epoch_second * 1000).toLocaleDateString('ja-JP'),
                  timestamp: sub.epoch_second,
                  submissionsCount: 0,
                  acCount: 0,
                  languages: new Set(),
                  lastSubmissionId: sub.id,
                  problemIds: new Set()
                };
              }

              contestsMap[sub.contest_id].submissionsCount++;
              contestsMap[sub.contest_id].languages.add(baseLang);
              contestsMap[sub.contest_id].problemIds.add(sub.problem_id);
              if (sub.result === 'AC') {
                contestsMap[sub.contest_id].acCount++;
              }
            });

            // メイン言語の決定・反映
            const topLang = Object.keys(langCounter).reduce(
              (a, b) => (langCounter[a] > langCounter[b] ? a : b),
              'None'
            );
            document.getElementById('user-lang').textContent = topLang;

            // オブジェクトから配列に変換し、日付の新しい順にソート
            globalContestData = Object.values(contestsMap).sort((a, b) => b.timestamp - a.timestamp);

            // 簡易的なプロフィールステータスの更新（コンテスト数から実力を仮判定）
            const uniqueProblemsCount = new Set(submissions.filter((s) => s.result === 'AC').map((s) => s.problem_id))
              .size;
            document.getElementById('user-rating').textContent = `${uniqueProblemsCount} ACs`;
            document.getElementById('user-rating').className = getRatingClass(uniqueProblemsCount * 3); // モック用の演出

            // レンダリング開始
            initRatingChart(globalContestData.slice().reverse());
            renderContestRecords(globalContestData);
          } catch (error) {
            console.error(error);
            recordsContainer.innerHTML =
              '<div class="text-center text-red-500 py-8">データの取得に失敗しました。時間をおいて再度お試しください。</div>';
          }
        }

        // --- 1. レートグラフの描画 (Chart.js) ---
        function initRatingChart(sortedData) {
          const ctx = document.getElementById('ratingChart').getContext('2d');
          if (!ctx) return;

          // 直近15件のコンテストデータを使用
          const chartDataNodes = sortedData.slice(-15);
          const labels = chartDataNodes.map((c) => c.date);

          // Problems APIからは純粋な「内部レート推移」が取れないため、
          // ここでは「そのコンテスト時点での総AC数」を擬似タイムラインとして可視化
          let acAccumulator = 0;
          const dataPoints = chartDataNodes.map((c) => {
            acAccumulator += c.acCount;
            return acAccumulator * 10 + 400; // 見栄え用のスケーリング
          });

          const gradient = ctx.createLinearGradient(0, 0, 0, 400);
          gradient.addColorStop(0, 'rgba(51, 122, 183, 0.4)');
          gradient.addColorStop(1, 'rgba(51, 122, 183, 0)');

          new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [
                {
                  label: 'Activity Score',
                  data: dataPoints,
                  borderColor: '#337ab7',
                  backgroundColor: gradient,
                  borderWidth: 3,
                  pointBackgroundColor: '#337ab7',
                  pointRadius: 4,
                  fill: true,
                  tension: 0.2
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: '#e0e0e0' } },
                x: { grid: { display: false } }
              }
            }
          });
        }

        // --- 2. コンテスト記録の描画 ---
        function renderContestRecords(data) {
          recordsContainer.innerHTML = '';

          data.forEach((contest, index) => {
            const langList = Array.from(contest.languages).join(', ');
            const cardHtml = `
              <div class="contest-card bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
                <div class="p-6">
                  <div class="flex flex-col md:flex-row justify-between md:items-center mb-3">
                    <h4 class="text-xl font-bold text-ac-blue">${contest.title}</h4>
                    <span class="text-sm text-gray-500 mt-1 md:mt-0">${contest.date}</span>
                  </div>
                  <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-gray-700 mb-4">
                    <span>解いた問題数 (AC): <strong class="text-gray-900">${contest.acCount} / ${contest.problemIds.size}</strong></span>
                    <span>総提出数: <strong class="text-gray-900">${contest.submissionsCount}</strong></span>
                    <span>使用言語: <strong class="text-gray-900">${langList}</strong></span>
                  </div>
                  <p class="text-gray-600 leading-relaxed mb-5">このコンテストでは期間中に計 ${contest.submissionsCount} 回提出し、${contest.acCount} 個のユニークな課題でACを獲得しました。</p>
                  <button
                    data-index="${index}"
                    class="details-btn text-ac-blue font-semibold transition-colors duration-300 hover:text-ac-blue-dark"
                  >
                    詳細を見る &rarr;
                  </button>
                </div>
              </div>
            `;
            recordsContainer.innerHTML += cardHtml;
          });

          // GSAPアニメーション
          gsap.to('.contest-card', {
            opacity: 1,
            y: 0,
            duration: 0.5,
            stagger: 0.1,
            ease: 'power3.out',
            delay: 0.3
          });
        }

        // --- 3. モーダルを開く ---
        function openModal(index) {
          const contest = globalContestData[index];

          document.getElementById('modal-title').textContent = contest.title;
          document.getElementById('modal-date').textContent = `初提出日: ${contest.date}`;
          document.getElementById('modal-stats').innerHTML = `
            <div>• 総AC数: <strong>${contest.acCount}</strong></div>
            <div>• ユニーク問題数: <strong>${contest.problemIds.size}</strong></div>
            <div>• 使用言語: <strong>${Array.from(contest.languages).join(', ')}</strong></div>
          `;
          document.getElementById('modal-comment').textContent = ``;

          // 該当コンテストの提出一覧ページへの公式リンク、または最新の提出詳細コードへの直リンク
          document.getElementById('modal-solution-link').href =
            `https://atcoder.jp/contests/${contest.id}/submissions?f.User=${USER_ID}`;

          modalBackdrop.style.display = 'flex';
          gsap.to(modalBackdrop, { opacity: 1, duration: 0.3, ease: 'power2.out' });
          gsap.to(modalContent, {
            opacity: 1,
            scale: 1,
            duration: 0.4,
            delay: 0.1,
            ease: 'back.out(1.4)'
          });

          document.body.style.overflow = 'hidden';
        }

        // --- 4. モーダルを閉じる ---
        function closeModal() {
          gsap.to(modalContent, { opacity: 0, scale: 0.95, duration: 0.3, ease: 'power2.in' });
          gsap.to(modalBackdrop, {
            opacity: 0,
            duration: 0.4,
            ease: 'power2.out',
            onComplete: () => {
              modalBackdrop.style.display = 'none';
              document.body.style.overflow = 'auto';
            }
          });
        }

        // ===============================================
        // イベントリスナー
        // ===============================================
        recordsContainer.addEventListener('click', (e) => {
          const button = e.target.closest('.details-btn');
          if (button) {
            openModal(button.dataset.index);
          }
        });

        modalCloseBtn.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', (e) => {
          if (e.target === modalBackdrop) closeModal();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && modalBackdrop.style.display === 'flex') closeModal();
        });

        // 初期データロード実行
        fetchAtCoderData();
      });
    </script>
  </body>
</html>
