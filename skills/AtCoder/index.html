<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtCoder Records - Takiguchi Workshop</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
      body {
        font-family: 'Inter', 'Noto Sans JP', sans-serif;
        background-color: #f8f8f8;
        color: #333;
      }

      #video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
      }
      #video-bg video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(8px) brightness(0.6);
      }

      main {
        position: relative;
        z-index: 10;
        background-color: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(2px);
      }

      .text-ac-blue {
        color: #337ab7;
      }
      .bg-ac-blue {
        background-color: #337ab7;
      }
      .hover\:bg-ac-blue-dark:hover {
        background-color: #286090;
      }

      /* AtCoderレートカラーパレット (JS連動用) */
      .rating-color-gray {
        color: #808080;
      }
      .rating-color-brown {
        color: #804000;
      }
      .rating-color-green {
        color: #008000;
      }
      .rating-color-cyan {
        color: #00c0c0;
      }
      .rating-color-blue {
        color: #0000ff;
      }
      .rating-color-yellow {
        color: #c0c000;
      }
      .rating-color-orange {
        color: #ff8000;
      }
      .rating-color-red {
        color: #ff0000;
      }

      /* 本家風レーティングサークルの基本スタイル */
      .topcoder-like-circle-big {
        display: inline-block;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        border: 10px solid transparent;
        box-sizing: border-box;
        background-clip: border-box;
        transition: all 1s ease-out;
      }

      .contest-card {
        opacity: 0;
        transform: translateY(20px);
      }

      #modal-backdrop {
        display: none;
        opacity: 0;
      }
      #modal-content {
        opacity: 0;
        transform: scale(0.95);
      }

      footer {
        position: relative;
        z-index: 10;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div id="video-bg">
      <video autoplay loop muted playsinline poster="https://placehold.co/1920x1080/000000/333333?text=Loading...">
        <source src="./videos/background.mp4" type="video/mp4" />
      </video>
    </div>

    <main class="min-h-screen">
      <div class="container mx-auto max-w-5xl px-6 py-16 md:py-24">
        <header class="text-center mb-16">
          <h1 class="text-5xl md:text-6xl font-bold tracking-tight text-gray-900">AtCoder</h1>
          <p class="text-xl md:text-2xl mt-4 text-gray-600">競技プログラミングの記録</p>
        </header>

        <section
          id="profile-section"
          class="bg-white p-8 rounded-lg shadow-lg flex flex-col md:flex-row items-center gap-8 mb-16"
        >
          <div class="w-32 h-32 flex items-center justify-center bg-white rounded-full shadow-md mx-auto md:mx-0">
            <span
              class="topcoder-like-circle-big rating-circle"
              id="RatingCircle-IlIlIlIlIlIlIlIl"
              style="
                border-color: rgb(128, 128, 128);
                background: linear-gradient(to top, rgb(128, 128, 128) 0%, rgba(0, 0, 0, 0) 0%) border-box;
              "
            ></span>
          </div>

          <div class="flex-1 text-center md:text-left">
            <h2 id="user-name" class="text-3xl font-bold text-gray-900 transition-colors duration-500">
              IlIlIlIlIlIlIlIl
            </h2>
            <p class="text-lg text-gray-600 mt-2">
              Estimated Rating: <span id="user-rating" class="font-bold text-xl">Loading...</span>
            </p>
            <p class="text-md text-gray-500 mt-1">
              Main Language: <span id="user-lang" class="font-semibold text-gray-700">Loading...</span>
            </p>
            <a
              id="atcoder-profile-link"
              href="https://atcoder.jp/users/IlIlIlIlIlIlIlIl"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-block bg-ac-blue text-white font-bold py-2 px-6 rounded-lg mt-4 transition-all duration-300 hover:bg-ac-blue-dark shadow-sm"
            >
              AtCoder Profile
            </a>
          </div>
        </section>

        <section id="rating-graph-section" class="bg-white p-6 md:p-8 rounded-lg shadow-lg mb-16">
          <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">Activity Score (Estimated from Submissions)</h3>
          <div class="w-full h-64 md:h-96">
            <canvas id="ratingChart"></canvas>
          </div>
        </section>

        <section id="contest-records-section">
          <h3 class="text-3xl font-bold text-gray-800 mb-8 text-center">Contest Records</h3>
          <div id="contest-records-container" class="space-y-6">
            <div class="text-center text-gray-500 py-8">データを取得中...</div>
          </div>
        </section>
      </div>
    </main>

    <footer class="text-center text-gray-400 py-10 border-t border-gray-700 bg-gray-900">
      <p>&copy; 2026 Takiguchi Workshop</p>
      <p class="mt-2 text-sm">
        このページの内容は Creative Commons 表示—継承（CC BY-SA）ライセンスの下で公開されています。
      </p>
    </footer>

    <div
      id="modal-backdrop"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-6"
    >
      <div id="modal-content" class="bg-white rounded-lg shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div class="p-6 md:p-8">
          <div class="flex justify-between items-start mb-4">
            <div>
              <h3 id="modal-title" class="text-2xl font-bold text-gray-900 text-ac-blue"></h3>
              <p id="modal-date" class="text-sm text-gray-500"></p>
            </div>
            <button
              id="modal-close-btn"
              class="text-gray-400 hover:text-gray-700 transition-colors text-3xl"
              title="閉じる"
            >
              &times;
            </button>
          </div>

          <div class="border-t border-gray-200 pt-4">
            <h4 class="text-lg font-semibold text-gray-800 mb-2">コンテストの統計・提出状況</h4>
            <div
              id="modal-stats"
              class="text-sm text-gray-600 mb-6 space-y-2 bg-gray-50 p-4 rounded-lg border border-gray-100"
            ></div>
            <a
              id="modal-solution-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-block bg-ac-blue text-white font-bold py-2 px-5 rounded-lg transition-all duration-300 hover:bg-ac-blue-dark shadow-sm"
            >
              提出一覧を見る
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const USER_ID = 'IlIlIlIlIlIlIlIl';
      let globalContestData = [];

      // レートに応じたRGB文字列とクラス名を返すオブジェクトマッパー
      const ratingTierMap = [
        { max: 400, color: 'rgb(128, 128, 128)', class: 'rating-color-gray' }, // 灰
        { max: 800, color: 'rgb(128, 64, 0)', class: 'rating-color-brown' }, // 茶
        { max: 1200, color: 'rgb(0, 128, 0)', class: 'rating-color-green' }, // 緑
        { max: 1600, color: 'rgb(0, 192, 192)', class: 'rating-color-cyan' }, // 水
        { max: 2000, color: 'rgb(0, 0, 255)', class: 'rating-color-blue' }, // 青
        { max: 2400, color: 'rgb(192, 192, 0)', class: 'rating-color-yellow' }, // 黄
        { max: 2800, color: 'rgb(255, 128, 0)', class: 'rating-color-orange' }, // 橙
        { max: Infinity, color: 'rgb(255, 0, 0)', class: 'rating-color-red' } // 赤
      ];

      function getRatingTier(rating) {
        return ratingTierMap.find((tier) => rating < tier.max);
      }

      document.addEventListener('DOMContentLoaded', () => {
        const recordsContainer = document.getElementById('contest-records-container');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        async function fetchAtCoderData() {
          try {
            const response = await fetch(
              `https://kenkoooo.com/atcoder/atcoder-api/v3/user/submissions?user=${USER_ID}&from_second=0`
            );
            if (!response.ok) throw new Error('API request failed');
            const submissions = await response.json();

            if (submissions.length === 0) {
              recordsContainer.innerHTML =
                '<div class="text-center text-gray-500 py-8">提出データが見つかりませんでした。</div>';
              return;
            }

            const contestsMap = {};
            const langCounter = {};

            submissions.sort((a, b) => b.epoch_second - a.epoch_second);

            submissions.forEach((sub) => {
              const baseLang = sub.language.split(' ')[0];
              langCounter[baseLang] = (langCounter[baseLang] || 0) + 1;

              if (!contestsMap[sub.contest_id]) {
                contestsMap[sub.contest_id] = {
                  id: sub.contest_id,
                  title: sub.contest_id.toUpperCase().replace(/_/g, ' '),
                  date: new Date(sub.epoch_second * 1000).toLocaleDateString('ja-JP'),
                  timestamp: sub.epoch_second,
                  submissionsCount: 0,
                  acCount: 0,
                  languages: new Set(),
                  problemIds: new Set()
                };
              }

              const contest = contestsMap[sub.contest_id];
              contest.submissionsCount++;
              contest.languages.add(baseLang);
              contest.problemIds.add(sub.problem_id);
              if (sub.result === 'AC') {
                contest.acCount++;
              }
            });

            const topLang = Object.keys(langCounter).reduce(
              (a, b) => (langCounter[a] > langCounter[b] ? a : b),
              'None'
            );
            document.getElementById('user-lang').textContent = topLang;

            globalContestData = Object.values(contestsMap).sort((a, b) => b.timestamp - a.timestamp);

            const uniqueProblemsCount = new Set(submissions.filter((s) => s.result === 'AC').map((s) => s.problem_id))
              .size;

            // 擬似実力レートの計算
            const estimatedRating = Math.min(3199, uniqueProblemsCount * 3.5 + 200);
            const tier = getRatingTier(estimatedRating);

            // プロフィールへのクラス付与
            const nameEl = document.getElementById('user-name');
            nameEl.className = `text-3xl font-bold ${tier.class} transition-colors duration-500`;

            const ratingEl = document.getElementById('user-rating');
            ratingEl.textContent = `${Math.floor(estimatedRating)} (${uniqueProblemsCount} ACs)`;
            ratingEl.className = `${tier.class} font-bold text-xl`;

            // ========================================================
            // 要求された AtCoder Problems 仕様のグラデーションサークル動的生成
            // ========================================================
            const ratingCircle = document.getElementById('RatingCircle-IlIlIlIlIlIlIlIl');

            // 下部からのせり上がりパーセンテージを計算 (400点ごとの端数割合)
            const fillPercent = Math.floor(((estimatedRating % 400) / 400) * 100);

            // スタイルの上書き適用
            ratingCircle.style.borderColor = tier.color;
            ratingCircle.style.background = `linear-gradient(to top, ${tier.color} ${fillPercent}%, rgba(0, 0, 0, 0) ${fillPercent}%) border-box`;

            // グラフとコンテストカードの展開
            initRatingChart(globalContestData.slice().reverse());
            renderContestRecords(globalContestData);
          } catch (error) {
            console.error(error);
            recordsContainer.innerHTML =
              '<div class="text-center text-red-500 py-8">データの取得に失敗しました。時間をおいて再度お試しください。</div>';
          }
        }

        function initRatingChart(sortedData) {
          const ctx = document.getElementById('ratingChart').getContext('2d');
          if (!ctx) return;

          const chartDataNodes = sortedData.slice(-15);
          const labels = chartDataNodes.map((c) => c.date);

          let acAccumulator = 0;
          const dataPoints = chartDataNodes.map((c) => {
            acAccumulator += c.acCount;
            return Math.floor(acAccumulator * 3.5 + 200);
          });

          const gradient = ctx.createLinearGradient(0, 0, 0, 400);
          gradient.addColorStop(0, 'rgba(51, 122, 183, 0.4)');
          gradient.addColorStop(1, 'rgba(51, 122, 183, 0)');

          new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [
                {
                  label: 'Estimated Rating 推移',
                  data: dataPoints,
                  borderColor: '#337ab7',
                  backgroundColor: gradient,
                  borderWidth: 3,
                  pointBackgroundColor: '#337ab7',
                  pointRadius: 4,
                  fill: true,
                  tension: 0.2
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: '#e0e0e0' } },
                x: { grid: { display: false } }
              }
            }
          });
        }

        function renderContestRecords(data) {
          recordsContainer.innerHTML = '';

          data.forEach((contest, index) => {
            const langList = Array.from(contest.languages).join(', ');
            const cardHtml = `
              <div class="contest-card bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
                <div class="p-6">
                  <div class="flex flex-col md:flex-row justify-between md:items-center mb-3">
                    <h4 class="text-xl font-bold text-ac-blue">${contest.title}</h4>
                    <span class="text-sm text-gray-500 mt-1 md:mt-0">${contest.date}</span>
                  </div>
                  <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-gray-700 mb-4">
                    <span>AC数: <strong class="text-gray-900">${contest.acCount} / ${contest.problemIds.size}</strong></span>
                    <span>総提出数: <strong class="text-gray-900">${contest.submissionsCount}</strong></span>
                    <span>使用言語: <strong class="text-gray-900">${langList}</strong></span>
                  </div>
                  <p class="text-gray-600 leading-relaxed mb-5">このコンテストでは期間中に計 ${contest.submissionsCount} 回提出し、${contest.acCount} 個のユニークな問題でACを獲得しました。</p>
                  <button
                    data-index="${index}"
                    class="details-btn text-ac-blue font-semibold transition-colors duration-300 hover:text-ac-blue-dark"
                  >
                    詳細を見る &rarr;
                  </button>
                </div>
              </div>
            `;
            recordsContainer.innerHTML += cardHtml;
          });

          gsap.to('.contest-card', {
            opacity: 1,
            y: 0,
            duration: 0.5,
            stagger: 0.08,
            ease: 'power3.out',
            delay: 0.2
          });
        }

        function openModal(index) {
          const contest = globalContestData[index];

          document.getElementById('modal-title').textContent = contest.title;
          document.getElementById('modal-date').textContent = `活動日: ${contest.date}`;
          document.getElementById('modal-stats').innerHTML = `
            <div>• <strong>正解した問題数 (AC):</strong> ${contest.acCount} / ${contest.problemIds.size}</div>
            <div>• <strong>このコンテストへの総提出回数:</strong> ${contest.submissionsCount} 回</div>
            <div>• <strong>使用された言語:</strong> ${Array.from(contest.languages).join(', ')}</div>
          `;

          document.getElementById('modal-solution-link').href =
            `https://atcoder.jp/contests/${contest.id}/submissions?f.User=${USER_ID}`;

          modalBackdrop.style.display = 'flex';
          gsap.to(modalBackdrop, { opacity: 1, duration: 0.3, ease: 'power2.out' });
          gsap.to(modalContent, {
            opacity: 1,
            scale: 1,
            duration: 0.4,
            delay: 0.05,
            ease: 'back.out(1.2)'
          });

          document.body.style.overflow = 'hidden';
        }

        function closeModal() {
          gsap.to(modalContent, { opacity: 0, scale: 0.95, duration: 0.2, ease: 'power2.in' });
          gsap.to(modalBackdrop, {
            opacity: 0,
            duration: 0.3,
            ease: 'power2.out',
            onComplete: () => {
              modalBackdrop.style.display = 'none';
              document.body.style.overflow = 'auto';
            }
          });
        }

        recordsContainer.addEventListener('click', (e) => {
          const button = e.target.closest('.details-btn');
          if (button) openModal(button.dataset.index);
        });

        modalCloseBtn.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', (e) => {
          if (e.target === modalBackdrop) closeModal();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && modalBackdrop.style.display === 'flex') closeModal();
        });

        fetchAtCoderData();
      });
    </script>
  </body>
</html>
