<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blender Works - Takiguchi Workshop</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>

    <style>
      body {
        font-family: 'Inter', 'Noto Sans JP', sans-serif;
        background-color: #111;
        color: #f0f0f0;
        overflow-y: scroll;
      }

      /* 背景動画 + グラデーションオーバーレイ */
      #video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: -2;
        overflow: hidden;
      }
      #video-bg video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #video-bg::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(10, 10, 10, 0.6), rgba(30, 30, 50, 0.6));
        z-index: -1;
      }

      #viewer-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 10;
      }

      .scroll-trigger {
        height: 100vh;
        width: 100%;
      }

      #ui-container {
        position: fixed;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        width: 90%;
        max-width: 600px;
        pointer-events: none;
        padding: 1.5rem;
        background: rgba(0, 0, 0, 0.4);
        backdrop-blur: 8px;
        border-radius: 1rem;
        border: 2px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        opacity: 0;
      }

      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 20;
        background: rgba(0, 0, 0, 0.8);
        backdrop-blur: 4px;
        text-align: center;
        color: #ccc;
        font-size: 0.875rem;
        padding: 1rem 0;
      }

      .glow-blue {
        text-shadow: 0 0 8px rgba(59, 130, 246, 0.7), 0 0 20px rgba(59, 130, 246, 0.5);
      }
      .glow-purple {
        text-shadow: 0 0 8px rgba(157, 52, 218, 0.7), 0 0 20px rgba(157, 52, 218, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="video-bg">
      <video autoplay loop muted playsinline poster="https://placehold.co/1920x1080/000000/333333?text=Loading...">
        <source src="./videos/background.mp4" type="video/mp4" />
      </video>
    </div>

    <div id="viewer-container"></div>

    <div id="ui-container">
      <h2 id="model-title" class="text-3xl md:text-4xl font-bold glow-blue transition-all duration-300"></h2>
      <p id="model-description" class="mt-4 text-lg text-gray-300"></p>
    </div>

    <div id="scroll-content" class="relative z-10"></div>

    <footer>
      <p>&copy; 2025 Takiguchi Workshop</p>
      <p class="mt-1">このページの作品は CC BY-SA で公開されています。</p>
    </footer>

    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      const viewerContainer = document.getElementById('viewer-container');
      const scrollContent = document.getElementById('scroll-content');
      const uiContainer = document.getElementById('ui-container');
      const modelTitle = document.getElementById('model-title');
      const modelDescription = document.getElementById('model-description');

      let scene, camera, renderer, controls, loader;
      let currentModel = null;
      let currentModelIndex = -1;

      // モデルデータを外部JSONから読み込む
      let models = [];
      async function loadModelsJSON() {
        try {
          const response = await fetch('./models/models.json');
          models = await response.json();
          setupScrollTriggers();
          setTimeout(() => {
            loadModel(0);
          }, 500);
        } catch (e) {
          console.error('JSONロード失敗:', e);
        }
      }

      function initThree() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 5);

        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        viewerContainer.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        loader = new GLTFLoader();
        window.addEventListener('resize', onWindowResize, false);
        animate();
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function loadModel(index) {
        if (index === currentModelIndex) return;
        currentModelIndex = index;
        const modelData = models[index];

        controls.reset();
        controls.autoRotate = true;

        if (currentModel) {
          gsap.to(currentModel.scale, {
            x: 0,
            y: 0,
            z: 0,
            duration: 0.5,
            ease: 'power2.in',
            onComplete: () => {
              scene.remove(currentModel);
              currentModel.traverse((child) => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                  if (Array.isArray(child.material)) {
                    child.material.forEach((mat) => mat.dispose());
                  } else {
                    child.material.dispose();
                  }
                }
              });
            }
          });
        }

        updateUI(modelData);

        loader.load(
          modelData.file,
          (gltf) => {
            currentModel = gltf.scene;
            currentModel.scale.set(0, 0, 0);
            scene.add(currentModel);
            gsap.to(currentModel.scale, { x: 1, y: 1, z: 1, duration: 1, ease: 'power2.out', delay: 0.5 });
          },
          undefined,
          (error) => {
            console.error('モデルロード失敗:', error);
            modelDescription.textContent = 'モデルのロードに失敗しました。';
          }
        );
      }

      function updateUI(modelData) {
        gsap.to(uiContainer, {
          opacity: 0,
          y: 20,
          duration: 0.3,
          ease: 'power2.in',
          onComplete: () => {
            modelTitle.textContent = modelData.title;
            modelDescription.textContent = modelData.description;
            modelTitle.className = 'text-3xl md:text-4xl font-bold transition-all duration-300';
            modelTitle.classList.add(modelData.accentColorClass);
            gsap.to(uiContainer, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out', delay: 0.2 });
          }
        });
      }

      function setupScrollTriggers() {
        models.forEach((model, index) => {
          const triggerEl = document.createElement('div');
          triggerEl.className = 'scroll-trigger';
          triggerEl.dataset.index = index;
          scrollContent.appendChild(triggerEl);
        });

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const index = parseInt(entry.target.dataset.index, 10);
                loadModel(index);
              }
            });
          },
          { root: null, rootMargin: '0px', threshold: 0.5 }
        );

        document.querySelectorAll('.scroll-trigger').forEach((el) => observer.observe(el));
      }

      viewerContainer.addEventListener(
        'mousedown',
        () => {
          controls.autoRotate = false;
        },
        { once: true }
      );

      initThree();
      loadModelsJSON();
    </script>
  </body>
</html>
